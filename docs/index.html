<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hearth &amp; Frost — WordPress demo</title>
<style>
  html,body{margin:0;height:100%;background:#0f0f0e;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .6s}
  iframe.ready{opacity:1}
  .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fbf9f5;font:300 15px/1.4 system-ui,sans-serif;letter-spacing:.04em}
  .boot b{font:300 34px/1 Georgia,serif;letter-spacing:0}
  .bar{width:180px;height:1px;background:rgba(251,249,245,.2);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#fbf9f5;animation:s 1.4s ease-in-out infinite}
  @keyframes s{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
</style>
</head>
<body>
<div class="boot" id="boot"><b>Hearth &amp; Frost</b><div class="bar"><i></i></div><span>Preparing the site…</span></div>
<iframe id="wp" title="Hearth &amp; Frost" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
  // Real WordPress (PHP compiled to WebAssembly) runs in the visitor's browser via WordPress Playground.
  // The theme archive sits next to this page, so the demo works on any address it is published at.
  var here = new URL('.', location.href).href;
  var landing = new URLSearchParams(location.search).get('page') || '/';
  if (landing.charAt(0) !== '/') landing = '/';
  var blueprint = {
    landingPage: landing,
    preferredVersions: { php: '8.3', wp: 'latest' },
    features: { networking: true },
    login: true,
    siteOptions: { blogname: 'Hearth & Frost', blogdescription: 'Luxury appliance service', timezone_string: 'America/Los_Angeles' },
    steps: [
      { step: 'installTheme', themeData: { resource: 'url', url: here + 'hearth-frost.zip?v=1' }, options: { activate: true } }
    ]
  };
  var f = document.getElementById('wp');
  f.addEventListener('load', function(){ setTimeout(function(){ f.className = 'ready'; document.getElementById('boot').style.display = 'none'; }, 400); });
  f.src = 'https://playground.wordpress.net/?mode=seamless#' + encodeURI(JSON.stringify(blueprint));
})();
</script>
</body>
</html>
